    <!-- Recover from a build asset served as text/html (cache-poisoning race):
         the browser refuses the module/stylesheet, so reload once (loop-guarded)
         to refetch. Runs first to catch the capture-phase load error. -->
    <script>
      (function () {
        var KEY = 'divine:recovery-reload';
        var COOLDOWN = 30000; // never reload more than once per 30s (loop guard)
        function recover(reason) {
          try {
            var last = +sessionStorage.getItem(KEY) || 0;
            if (Date.now() - last < COOLDOWN) return;
            sessionStorage.setItem(KEY, '' + Date.now());
            location.reload();
          } catch (e) {}
        }
        // Resource load errors don't bubble, so listen in capture. Scoped to
        // /assets/ so third-party (ad/font) failures are ignored.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (!t || !t.tagName) return;
          var url = t.href || t.src || '';
          if ((t.tagName === 'LINK' || t.tagName === 'SCRIPT') && url.indexOf('/assets/') !== -1) {
            recover('asset load failed: ' + url);
          }
        }, true);
        // Backstop: if the app never mounts 10s after this runs, reload once.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) recover('app did not mount');
        }, 10000);
      })();
    </script>
