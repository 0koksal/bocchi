name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Fix pnpm-workspace for CI
        run: |
          @"
          packages: []
          onlyBuiltDependencies:
            - electron
            - esbuild
          "@ | Set-Content pnpm-workspace.yaml

      - name: Install dependencies (skip native rebuild)
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      
      - name: Run postinstall scripts (electron + esbuild only)
        run: |
          node node_modules/.pnpm/electron@35.7.5/node_modules/electron/install.js
          node node_modules/.pnpm/esbuild@0.25.12/node_modules/esbuild/install.js

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win --publish always
